<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Products Practise</title>
    <style>
        .products{
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(8, minmax(0, 1fr));
            gap: 15px;
            align-items: stretch;
        }
        .card{
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid rgb(195, 191, 191);
            border-radius: 5px;
            background-color: aliceblue;
            box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
            box-sizing: border-box;
            min-width: 0;

        }
        .card img{
            padding: 20px;
            width: 50%;
            height: 120px;
            object-fit: contain;
            border-radius:10px 10px 0 0 ;
        }
        .card p{
            margin: 0;
            padding: 5px 5px;
            text-align: center;
        }
        .name{
            font-weight: 600;
        }
        .price{
            font-size: 15px;
            font-weight: 500;
        }

        
    </style>
</head>
<body>

    <h2 style="text-align: center;">Products</h2>
    <div class="products" id="products"></div>

    <script src="script.js"></script>
    
</body>
</html>
